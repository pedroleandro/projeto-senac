version: '3.8'

services:

  # ---------------------------------------------------------------
  # PHP-FPM 8.2
  # ---------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: senac_app
    restart: unless-stopped
    volumes:
      - .:/var/www/html
    networks:
      - senac_network
    depends_on:
      - db

  # ---------------------------------------------------------------
  # Nginx
  # ---------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: senac_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - senac_network
    depends_on:
      - app

  # ---------------------------------------------------------------
  # MySQL 8.0
  # ---------------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: senac_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_DATABASE:-projeto}
    ports:
      - "3306:3306"
    volumes:
      - senac_db_data:/var/lib/mysql
    networks:
      - senac_network

  # ---------------------------------------------------------------
  # phpMyAdmin — acesso visual ao banco (opcional, remova se quiser)
  # ---------------------------------------------------------------
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: senac_phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
    networks:
      - senac_network
    depends_on:
      - db

networks:
  senac_network:
    driver: bridge

volumes:
  senac_db_data:
    driver: local